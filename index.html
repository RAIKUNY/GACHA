<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Персонажи</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;

    background-image: url("images/ui/background_gacha.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  .arena {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: stretch;
    padding: 15px;
    gap: 12px;
  }

  .player-panel {
    flex: 0 0 34%;
    max-width: 580px;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    padding: 10px;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }

  .player-name {
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-bottom: 6px;
    position: relative;
    z-index: 25;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .player-name:hover { transform: scale(1.04); }
  .player-name.hidden-locked { cursor: default; }
  .player-name.hidden-locked:hover { transform: none; }
  .player-name img { max-height: 100%; max-width: 90%; object-fit: contain; pointer-events: none; }

  .name-unknown {
    width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #4a4a6a, #15121e 70%);
    box-shadow: 0 0 30px rgba(120, 90, 200, 0.35), inset 0 0 20px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    font: bold 42px sans-serif; color: rgba(200, 180, 255, 0.7);
    text-shadow: 0 0 12px rgba(160, 120, 255, 0.6);
  }

  .player-image {
    flex: 1; display: flex; align-items: center; justify-content: center;
    min-height: 0; position: relative; z-index: 5;
    transition: filter 0.35s ease;
  }
  .player-image img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* ===== СВЕЧЕНИЕ ПО РЕДКОСТИ (ГАЧА) ===== */
  .player-image[data-rarity="common"] {
    filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.55))
            drop-shadow(0 0 55px rgba(255, 255, 255, 0.25));
  }
  .player-image[data-rarity="rare"] {
    filter: drop-shadow(0 0 22px rgba(77, 142, 255, 0.7))
            drop-shadow(0 0 55px rgba(77, 142, 255, 0.35));
  }
  .player-image[data-rarity="epic"] {
    filter: drop-shadow(0 0 22px rgba(180, 77, 255, 0.75))
            drop-shadow(0 0 55px rgba(180, 77, 255, 0.4));
  }
  .player-image[data-rarity="legendary"] {
    filter: drop-shadow(0 0 24px rgba(255, 209, 102, 0.9))
            drop-shadow(0 0 65px rgba(255, 150, 50, 0.55));
    animation: legendary-aura 2.2s ease-in-out infinite alternate;
  }
  @keyframes legendary-aura {
    from { filter: drop-shadow(0 0 20px rgba(255, 209, 102, 0.7))
                   drop-shadow(0 0 50px rgba(255, 150, 50, 0.35)); }
    to   { filter: drop-shadow(0 0 30px rgba(255, 209, 102, 1))
                   drop-shadow(0 0 80px rgba(255, 150, 50, 0.6)); }
  }

  .silhouette {
    width: 60%; max-width: 320px; aspect-ratio: 3 / 4;
    position: relative; display: flex; align-items: flex-end; justify-content: center;
    filter: drop-shadow(0 0 30px rgba(80, 60, 140, 0.4));
  }
  .silhouette::before {
    content: ""; position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
    width: 38%; aspect-ratio: 1 / 1; border-radius: 50%;
    background: #0a0a0f; box-shadow: 0 0 0 2px rgba(120, 90, 200, 0.15);
  }
  .silhouette::after {
    content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 92%; height: 62%; border-radius: 45% 45% 0 0 / 30% 30% 0 0;
    background: #0a0a0f; box-shadow: 0 0 0 2px rgba(120, 90, 200, 0.15);
  }

  .stats-panel {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 15;
    display: flex; align-items: flex-start; justify-content: center;
    pointer-events: none; transition: transform 0.35s ease; overflow: hidden;
    transform: translateY(-100%);
  }
  .stats-panel img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .stats-panel.open { transform: translateY(0); pointer-events: auto; }

  .costume-carousel {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 10px; flex-shrink: 0; position: relative; z-index: 25; min-height: 66px;
  }
  .carousel-arrow {
    width: 44px; height: 44px; border: none; background: transparent; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s; flex-shrink: 0;
  }
  .carousel-arrow img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .carousel-arrow:hover { transform: scale(1.1); }
  .carousel-arrow.hidden { visibility: hidden; }

  .costumes-window { width: 5 * 54px + 4 * 8px; overflow: hidden; flex-shrink: 0; padding: 6px 0; }
  .costumes { display: flex; gap: 8px; align-items: center; transition: transform 0.25s ease; }
  .costume-btn {
    width: 54px; height: 54px; border: none; background: transparent; cursor: pointer; padding: 0;
    transition: transform 0.15s, filter 0.2s;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .costume-btn img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .costume-btn:hover:not(.locked) { transform: scale(1.06); }
  .costume-btn.active { transform: scale(1.08); }
  .costume-btn.locked { cursor: not-allowed; }
  .costume-btn.locked:hover { transform: none; }

  .center-column {
    flex: 1; min-width: 0; display: flex; gap: 8px; align-items: stretch;
    padding: 10px; padding-top: 40px; background: rgba(0, 0, 0, 0.25);
    border-radius: 12px; position: relative;
  }

  .gacha-floating-btn {
    position: absolute; top: 90px; left: 20px; width: 100px; height: 100px;
    padding: 0; border: none; background: transparent; cursor: pointer;
    z-index: 500; transition: transform 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .gacha-floating-btn img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  .gacha-floating-btn:hover { transform: scale(1.05); }
  .gacha-floating-btn .gacha-fallback {
    width: 100%; height: 100%; border-radius: 0;
    background: linear-gradient(135deg, #ffd166, #c17bff); color: #1a1024;
    font: bold 18px sans-serif; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .minigame-floating-btn {
    position: absolute; top: 220px; left: 20px; width: 100px; height: 100px;
    padding: 0; border: none; background: transparent; cursor: pointer;
    z-index: 500; transition: transform 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .minigame-floating-btn img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  .minigame-floating-btn:hover { transform: scale(1.05); }
  .minigame-floating-btn .gacha-fallback {
    width: 100%; height: 100%; border-radius: 0;
    background: linear-gradient(135deg, #8ab4ff, #5aa0ff); color: #06112a;
    font: bold 18px sans-serif; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .collection-floating-btn {
    position: absolute; top: 350px; left: 20px; width: 100px; height: 100px;
    padding: 0; border: none; background: transparent; cursor: pointer;
    z-index: 500; transition: transform 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .collection-floating-btn img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  .collection-floating-btn:hover { transform: scale(1.05); }
  .collection-floating-btn .gacha-fallback {
    width: 100%; height: 100%; border-radius: 0;
    background: linear-gradient(135deg, #c17bff, #8a4dff); color: #fff;
    font: bold 18px sans-serif; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .character-grid {
    flex: 1; display: grid; grid-template-columns: repeat(5, 190px); gap: 12px;
    justify-content: center; align-content: start; height: 100%;
    overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none;
  }
  .character-grid::-webkit-scrollbar { display: none; }

  .portrait-btn {
    width: 190px; height: 190px; border: none; background: transparent;
    cursor: pointer; padding: 0; transition: transform 0.15s, filter 0.2s;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .portrait-btn img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .portrait-btn:hover:not(.locked) { transform: scale(1.05); }
  .portrait-btn.p1-active {
    transform: scale(1.1);
    filter: drop-shadow(0 0 12px #ff5a5a);
  }

  @media (max-width: 1500px) {
    .character-grid { grid-template-columns: repeat(4, 190px); }
  }
  @media (max-width: 1280px) {
    .character-grid { grid-template-columns: repeat(3, 190px); }
    .center-column { padding-top: 10px; }
  }
  @media (max-width: 1024px) {
    .character-grid { grid-template-columns: repeat(2, 190px); }
  }
  @media (max-width: 720px) {
    .arena { flex-direction: column; }
    .player-panel { flex: 0 0 50%; min-width: 0; max-width: none; }
    .character-grid { grid-template-columns: repeat(3, 1fr); }
    .portrait-btn { width: 100%; height: auto; aspect-ratio: 1 / 1; }
  }

  .scroll-track {
    width: 36px; height: 100%; position: relative; flex-shrink: 0; user-select: none;
  }
  .track-line {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #fff;
    transform: translateX(-50%); border-radius: 2px; opacity: 0.7;
  }
  .track-arrow {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #fff; cursor: pointer; z-index: 3; text-shadow: 0 0 4px #000;
  }
  .track-arrow.up { top: -28px; }
  .track-arrow.down { bottom: -28px; }

  .slider-thumb {
    position: absolute; left: 50%; width: 28px; height: 28px;
    background: #fff; border: 3px solid #222; border-radius: 50%;
    cursor: grab; z-index: 2; transform: translate(-50%, -50%);
    box-shadow: 0 0 6px rgba(0,0,0,0.5);
  }
  .slider-thumb.dragging { cursor: grabbing; }

  .updates-toggle {
    position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    width: 90px; height: 25px; padding: 0; border: none; background: transparent;
    cursor: pointer; z-index: 500; transition: transform 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .updates-toggle img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  .updates-toggle:hover { transform: translateX(-50%) scale(1.08); }

  .switch-mode-btn {
    position: fixed; top: 8px; left: calc(50% + 90px + 8px);
    width: 90px; height: 25px; padding: 0; border: none; background: transparent;
    cursor: pointer; z-index: 500; display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s;
  }
  .switch-mode-btn img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  .switch-mode-btn:hover { transform: scale(1.08); }
  .switch-mode-btn .fallback-icon {
    width: 100%; height: 100%; background: rgba(255,255,255,0.1); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font: bold 13px sans-serif; border-radius: 6px;
  }

  .updates-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
    z-index: 550; opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s;
  }
  .updates-overlay.open { opacity: 1; visibility: visible; }

  .updates-panel {
    position: fixed; top: 0; left: 50%; width: 92vw; max-width: 1200px; max-height: 92vh;
    background: rgba(20, 15, 30, 0.98); color: #fff; z-index: 600;
    padding: 18px 28px 24px;
    border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
    border: 2px solid rgba(255,255,255,0.2); border-top: none;
    box-shadow: 0 12px 40px rgba(0,0,0,0.7); overflow: hidden;
    font-family: sans-serif; font-size: 14px;
    display: flex; flex-direction: column;
    transform: translate(-50%, -100%); opacity: 0; visibility: hidden;
    transition: transform 0.35s ease, opacity 0.25s ease, visibility 0.25s;
  }
  .updates-panel.open { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

  .updates-panel .close-row { text-align: center; margin-bottom: 14px; flex-shrink: 0; }
  .updates-panel .close-row button {
    background: #444; color: #fff; border: none; border-radius: 8px;
    padding: 8px 22px; cursor: pointer; font-size: 14px; font-family: sans-serif;
    transition: background 0.15s;
  }
  .updates-panel .close-row button:hover { background: #666; }

  .updates-columns {
    display: grid; grid-template-columns: 1fr 1.4fr; gap: 24px;
    align-items: start; flex: 1; min-height: 0; overflow: hidden;
  }
  @media (max-width: 900px) { .updates-columns { grid-template-columns: 1fr; } }

  .updates-column {
    min-width: 0; display: flex; flex-direction: column;
    max-height: 100%; overflow: hidden;
  }
  .updates-list {
    overflow-y: auto; padding-right: 6px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.3) transparent;
  }
  .updates-list::-webkit-scrollbar { width: 8px; }
  .updates-list::-webkit-scrollbar-track { background: transparent; }
  .updates-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 4px; }
  .updates-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

  .updates-group-title {
    color: #ffd166; font-size: 14px; text-transform: uppercase;
    letter-spacing: 1.5px; margin: 0 0 10px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 6px;
    font-weight: bold; flex-shrink: 0; display: flex; align-items: baseline; gap: 8px;
  }
  .updates-group-title .count {
    display: inline-block; background: rgba(255, 209, 102, 0.15); color: #ffd166;
    font-size: 13px; padding: 1px 10px; border-radius: 12px;
    font-weight: bold; letter-spacing: 0.5px;
  }

  .update-item {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.05); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 8px; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .update-item:hover { background: rgba(255,255,255,0.14); transform: translateX(4px); }
  .update-item.locked { cursor: not-allowed; opacity: 0.6; }
  .update-item.locked:hover { background: rgba(255,255,255,0.05); transform: none; }

  .update-item .imgs { display: flex; gap: 6px; flex-shrink: 0; }
  .update-item .imgs img {
    width: 70px; height: 70px; object-fit: contain;
    background: #222; border-radius: 10px; padding: 4px;
  }
  .update-item .info { flex: 1; min-width: 0; }
  .update-item .info .label {
    font-size: 18px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; font-weight: bold; line-height: 1.25;
  }
  .update-item .info .sub {
    font-size: 15px; color: #bbb; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; margin-top: 4px; line-height: 1.25;
  }
  .update-item .info .date {
    font-size: 13px; color: #888; margin-top: 4px; line-height: 1.25;
  }

  .updates-empty { color: #888; font-size: 13px; text-align: center; padding: 20px 0; }

  /* ============================================================
     ГАЧА — СТИЛИ
     ============================================================ */

  .gacha-modal {
    position: fixed; inset: 0; z-index: 700;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .gacha-modal.open { display: flex; }
  .gacha-modal .backdrop {
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.7);
  }

  .gacha-card {
    position: relative; width: 100%; max-width: 480px; max-height: 90vh;
    overflow-y: auto; background: rgba(20, 15, 30, 0.98);
    border: 2px solid rgba(255,255,255,0.2); border-radius: 18px;
    padding: 22px 24px; color: #fff; font-family: sans-serif;
    box-shadow: 0 12px 40px rgba(0,0,0,0.8);
    display: flex; flex-direction: column; gap: 14px;
  }
  .gacha-card h2 {
    margin: 0; font-size: 20px; text-align: center;
    color: #ffd166; letter-spacing: 1px;
  }

  .gacha-close {
    position: absolute; top: 10px; right: 12px;
    background: transparent; border: none; color: #fff;
    font-size: 22px; cursor: pointer; line-height: 1;
    padding: 4px 8px; border-radius: 6px;
  }
  .gacha-close:hover { background: rgba(255,255,255,0.1); }

  .gacha-topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
  }
  .gacha-balance {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255, 209, 102, 0.12);
    border: 1px solid rgba(255, 209, 102, 0.4);
    border-radius: 12px; padding: 6px 12px;
    font-weight: bold; color: #ffd166; font-size: 16px;
  }
  .gacha-balance .token-icon {
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffe9a8, #ffb02e 70%);
    box-shadow: 0 0 8px rgba(255, 209, 102, 0.6);
  }
  .gacha-balance .token-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .profile-switch { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .profile-btn {
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05); color: #fff;
    border-radius: 8px; padding: 4px 10px;
    font: bold 12px sans-serif; cursor: pointer;
    transition: transform 0.12s, background 0.12s, border-color 0.12s;
  }
  .profile-btn:hover { background: rgba(255,255,255,0.15); }
  .profile-btn.active {
    background: rgba(255, 209, 102, 0.25);
    border-color: #ffd166; color: #ffd166; transform: scale(1.05);
  }

  .gacha-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .gacha-btn {
    border: none; border-radius: 10px; padding: 10px 16px;
    font: bold 14px sans-serif; cursor: pointer; color: #1a1024;
    background: linear-gradient(135deg, #ffd166, #ffb02e);
    transition: transform 0.12s, filter 0.12s;
    display: flex; align-items: center; gap: 8px;
  }
  .gacha-btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
  .gacha-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .gacha-btn.secondary {
    background: linear-gradient(135deg, #8ab4ff, #5aa0ff); color: #06112a;
  }
  .gacha-btn.ghost {
    background: rgba(255,255,255,0.1); color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .gacha-btn.danger {
    background: linear-gradient(135deg, #ff8a8a, #e04242); color: #fff;
  }

  .minigame-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .minigame-hud {
    width: 100%; display: flex; justify-content: space-between;
    font-size: 14px; color: #bbb;
  }
  .minigame-hud b { color: #ffd166; }
  .minigame-field {
    position: relative; width: 340px; height: 340px; max-width: 100%;
    background: radial-gradient(circle at 50% 50%, #1a2438, #0b1020);
    border: 2px solid rgba(255,255,255,0.15); border-radius: 16px;
    overflow: hidden; cursor: crosshair; user-select: none;
  }
  .crystal {
    position: absolute; width: 44px; height: 44px;
    margin-left: -22px; margin-top: -22px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #b8f0ff, #4dd2ff 60%, #1e7fb8);
    box-shadow: 0 0 18px rgba(77, 210, 255, 0.8);
    cursor: pointer; animation: crystal-pop 0.18s ease-out;
  }
  .crystal::after {
    content: ""; position: absolute; inset: 10px;
    background: rgba(255,255,255,0.6); border-radius: 50%; filter: blur(3px);
  }
  @keyframes crystal-pop {
    from { transform: scale(0.2); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .minigame-result {
    font-size: 15px; color: #fff; text-align: center; min-height: 22px;
  }
  .minigame-result b { color: #ffd166; }

  .box-stage { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .box-visual {
    width: 300px; height: 300px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #adfffe, #c17bff);
    box-shadow: 0 0 30px rgba(193, 123, 255, 0.5);
    transition: transform 0.3s, box-shadow 0.3s; overflow: hidden;
  }
  .box-visual img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .box-visual img.box-img { transition: transform 0.3s; }
  .box-visual img.box-img.shaking { animation: box-shake 0.5s ease-in-out; }
  .box-visual.fallback {
    font: bold 22px sans-serif; color: #1a1024;
    background: linear-gradient(135deg, #ffd166, #c17bff);
  }
  @keyframes box-shake {
    0%,100% { transform: rotate(0); }
    20% { transform: rotate(-6deg) scale(1.05); }
    40% { transform: rotate(6deg) scale(1.05); }
    60% { transform: rotate(-4deg) scale(1.05); }
    80% { transform: rotate(4deg) scale(1.05); }
  }

  .reward-card {
    position: relative;
    width: 200px; height: 260px; border-radius: 16px;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(81, 20, 179, 0.6);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 10px;
    animation: reward-in 0.5s ease-out;
    transition: box-shadow 0.3s, border-color 0.3s;
  }
  @keyframes reward-in {
    from { transform: scale(0.6) rotateY(90deg); opacity: 0; }
    to { transform: scale(1) rotateY(0); opacity: 1; }
  }
  .reward-card img { width: 190px; height: 190px; object-fit: contain; }
  .reward-card .reward-title { font-size: 13px; color: #5114b3; font-weight: bold; text-align: center; }
  .reward-card.duplicate .reward-title { color: #2656ab; }
  .reward-card .reward-sub { font-size: 15px; font-weight: bold; color: #000000; text-align: center; }
  .reward-card .reward-status { font-size: 11px; color: #ffffff; text-align: center; margin-top: 2px; }
  .reward-card.duplicate .reward-status { color: #ffffff; }

  .reward-card[data-rarity="common"] {
    border-color: #8e8e8e;
    box-shadow: 0 0 14px rgba(142, 142, 142, 0.4);
  }
  .reward-card[data-rarity="rare"] {
    border-color: #4d8eff;
    box-shadow: 0 0 20px rgba(77, 142, 255, 0.5);
  }
  .reward-card[data-rarity="epic"] {
    border-color: #b44dff;
    box-shadow: 0 0 24px rgba(180, 77, 255, 0.6);
  }
  .reward-card[data-rarity="legendary"] {
    border-color: #ffd166;
    box-shadow: 0 0 30px rgba(255, 209, 102, 0.85), 0 0 60px rgba(255, 150, 50, 0.45);
    animation: reward-in 0.5s ease-out, legendary-glow 2s ease-in-out infinite alternate;
  }
  @keyframes legendary-glow {
    from { box-shadow: 0 0 22px rgba(255, 209, 102, 0.7), 0 0 50px rgba(255, 150, 50, 0.3); }
    to   { box-shadow: 0 0 34px rgba(255, 209, 102, 0.95), 0 0 80px rgba(255, 150, 50, 0.55); }
  }

  .rarity-badge {
    position: absolute; top: 6px; left: 6px;
    font: bold 10px sans-serif; letter-spacing: 0.5px;
    color: #fff; padding: 2px 8px; border-radius: 10px;
    text-transform: uppercase;
  }
  .reward-card[data-rarity="common"]    .rarity-badge { background: #6f6f6f; }
  .reward-card[data-rarity="rare"]      .rarity-badge { background: #4d8eff; }
  .reward-card[data-rarity="epic"]      .rarity-badge { background: #b44dff; }
  .reward-card[data-rarity="legendary"] .rarity-badge { background: #ffd166; color: #1a1024; }

  .odds-line {
    font-size: 11px;
    color: #bbb;
    text-align: center;
    line-height: 1.5;
    user-select: none;
  }
  .odds-line .dot {
    display: inline-block;
    width: 8px; height: 8px; border-radius: 50%;
    margin: 0 3px 0 8px;
    vertical-align: middle;
  }
  .odds-line .dot.common    { background: #8e8e8e; }
  .odds-line .dot.rare      { background: #4d8eff; }
  .odds-line .dot.epic      { background: #b44dff; }
  .odds-line .dot.legendary { background: #ffd166; }
  .odds-line .pity {
    display: block;
    margin-top: 4px;
    color: #ffb84d;
    font-weight: bold;
  }

  .collection-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

  .collection-cell {
    height: 180px;
    border-radius: 10px;
    background: rgba(0,0,0,0.15);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .collection-cell .main-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .collection-cell .costume-icon {
    position: absolute;
    right: 4px;
    bottom: 4px;
    width: 40px;
    height: 40px;
    object-fit: contain;

    box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    pointer-events: none;
  }

  .collection-cell.locked { filter: grayscale(1) brightness(0.3); }
  .collection-cell.locked::after {
    content: "?"; position: absolute;
    color: rgba(255,255,255,0.5); font: bold 22px sans-serif;

   ДАЛЬШЕ КОД — ЛУЧШЕ НЕ ТРОГАТЬ
   ============================================================ */

const VISIBLE = 5;
const BTN_SIZE = 54;
const BTN_GAP = 8;

const player = { char: 0, costume: 0, offset: 0 };

const charGridEl  = document.getElementById('charGrid');
const trackEl     = document.getElementById('scrollTrack');
const thumbEl     = document.getElementById('sliderThumb');
const arrowUpEl   = document.getElementById('arrowUp');
const arrowDownEl = document.getElementById('arrowDown');

const ui = {
  panel:    document.getElementById('panel1'),
  name:     document.getElementById('name1'),
  image:    document.getElementById('image1'),
  list:     document.getElementById('costumes1'),
  prev:     document.getElementById('prev1'),
  next:     document.getElementById('next1'),
  statsEl:  document.getElementById('stats1'),
  statsImg: document.getElementById('statsImg1')
};

function renderPlayer() {
  const charOwned = isCharOwned(player.char);
  const char = characters[player.char];

  if (!charOwned) {
    ui.name.classList.add('hidden-locked');
    ui.name.innerHTML = '<div class="name-unknown">?</div>';
  } else {
    ui.name.classList.remove('hidden-locked');
    ui.name.innerHTML = '<img src="' + char.name + '" alt="">';
  }

  if (!charOwned) {
    ui.image.innerHTML = '<div class="silhouette"></div>';
  } else {
    const costume = char.costumes[player.costume];
    if (costume && costume.image) {
      ui.image.innerHTML = '<img src="' + costume.image + '" alt="">';
    } else {
      ui.image.innerHTML = '';
    }
  }

  // Свечение по редкости текущего костюма (только для открытого персонажа)
  if (charOwned) {
    const costume = char.costumes[player.costume];
    const rarity = (costume && costume.rarity) || 'common';
    ui.image.setAttribute('data-rarity', rarity);
  } else {
    ui.image.removeAttribute('data-rarity');
  }

  if (charOwned) {
    const costume = char.costumes[player.costume];
    if (costume && costume.stats) {
      ui.statsImg.src = costume.stats;
    } else {
      ui.statsImg.src = '';
    }
  } else {
    ui.statsImg.src = '';
    ui.statsEl.classList.remove('open');
  }

  const totalItems = char.costumes.length + 1;

  ui.list.innerHTML = '';

  if (!charOwned) {
    for (let i = 0; i < char.costumes.length; i++) {
      const btn = document.createElement('button');
      btn.className = 'costume-btn locked';
      btn.disabled = true;
      btn.innerHTML = '<img src="images/gacha/locked_costume.png" alt="" style="width:100%;height:100%;object-fit:contain;">';
      ui.list.appendChild(btn);
    }
  } else {
    char.costumes.forEach(function(c, i) {
      const owned = isCostumeOwned(player.char, i);
      const btn = document.createElement('button');
      btn.className = 'costume-btn' + (i === player.costume ? ' active' : '');
      if (!owned) {
        btn.classList.add('locked');
        btn.disabled = true;
        btn.innerHTML = '<img src="images/gacha/locked_costume.png" alt="" style="width:100%;height:100%;object-fit:contain;">';
      } else {
        btn.innerHTML = '<img src="' + c.icon + '" alt="">';
        btn.onclick = function(e) {
          e.stopPropagation();
          player.costume = i;
          renderPlayer();
        };
      }
      ui.list.appendChild(btn);
    });
  }

  const addCostume = document.createElement('button');
  addCostume.className = 'costume-btn';
  addCostume.innerHTML = '<img src="' + UI.plus + '" alt="">';
  ui.list.appendChild(addCostume);

  const shift = player.offset * (BTN_SIZE + BTN_GAP);
  ui.list.style.transform = 'translateX(' + (-shift) + 'px)';

  if (totalItems > VISIBLE) {
    ui.prev.classList.remove('hidden');
    ui.next.classList.remove('hidden');
    ui.prev.classList.toggle('hidden', player.offset === 0);
    ui.next.classList.toggle('hidden', player.offset >= totalItems - VISIBLE);
  } else {
    ui.prev.classList.add('hidden');
    ui.next.classList.add('hidden');
  }
}

function renderGrid() {
  charGridEl.innerHTML = '';

  characters.forEach(function(c, i) {
    const btn = document.createElement('button');
    const owned = isCharOwned(i);

    let cls = 'portrait-btn';
    if (player.char === i) cls += ' p1-active';
    if (!owned) cls += ' locked';

    btn.className = cls;

    if (owned) {
      btn.innerHTML = '<img src="' + c.portrait + '" alt="">';
      btn.onclick = function() {
        player.char = i;
        player.costume = firstOwnedCostume(i);
        player.offset = 0;
        renderPlayer();
        renderGrid();
      };
    } else {
      btn.innerHTML = '<img src="images/gacha/locked_portrait.png" alt="" style="width:100%;height:100%;object-fit:contain;border-radius:16px;">';
      btn.disabled = true;
      btn.title = 'Ещё не выпал из блайндбокса';
    }

    charGridEl.appendChild(btn);
  });

  const addChar = document.createElement('button');
  addChar.className = 'portrait-btn';
  addChar.innerHTML = '<img src="' + UI.plus + '" alt="">';
  charGridEl.appendChild(addChar);

  updateThumb();
}

function toggleStats() {
  if (!isCharOwned(player.char)) return;
  ui.statsEl.classList.toggle('open');
}

ui.name.addEventListener('click', function(e) { e.stopPropagation(); toggleStats(); });
ui.statsEl.addEventListener('click', function(e) { e.stopPropagation(); toggleStats(); });

ui.prev.addEventListener('click', function(e) {
  e.stopPropagation();
  if (!isCharOwned(player.char)) return;
  const prev = prevOwnedCostume(player.char, player.costume);
  if (prev !== -1) { player.costume = prev; renderPlayer(); }
});

ui.next.addEventListener('click', function(e) {
  e.stopPropagation();
  if (!isCharOwned(player.char)) return;
  const next = nextOwnedCostume(player.char, player.costume);
  if (next !== -1) { player.costume = next; renderPlayer(); }
});

function getTrackBounds() {
  const rect = trackEl.getBoundingClientRect();
  return { top: 0, bottom: rect.height, height: rect.height };
}

function updateThumb() {
  const bounds = getTrackBounds();
  const scrollable = charGridEl.scrollHeight - charGridEl.clientHeight;

  let thumbSize = 28;
  if (scrollable > 0) {
    const visibleRatio = charGridEl.clientHeight / charGridEl.scrollHeight;
    thumbSize = Math.max(20, Math.min(28, bounds.height * visibleRatio));
  }

  thumbEl.style.width  = thumbSize + 'px';
  thumbEl.style.height = thumbSize + 'px';

  if (scrollable <= 0) {
    thumbEl.style.top = (bounds.top + bounds.height / 2) + 'px';
    return;
  }

  const ratio = charGridEl.scrollTop / scrollable;
  const maxTop = bounds.height - thumbSize;
  thumbEl.style.top = (thumbSize / 2 + ratio * maxTop) + 'px';
}

let isDragging = false;
let dragStartY = 0;
let dragStartScroll = 0;

thumbEl.addEventListener('mousedown', function(e) {
  isDragging = true;
  dragStartY = e.clientY;
  dragStartScroll = charGridEl.scrollTop;
  thumbEl.classList.add('dragging');
  e.preventDefault();
  e.stopPropagation();
});

document.addEventListener('mousemove', function(e) {
  if (!isDragging) return;
  const bounds = getTrackBounds();
  const scrollable = charGridEl.scrollHeight - charGridEl.clientHeight;
  if (scrollable <= 0) return;

  const thumbSize = thumbEl.offsetHeight;
  const maxTop = bounds.height - thumbSize;
  const deltaY = e.clientY - dragStartY;
  const scrollDelta = (deltaY / maxTop) * scrollable;
  charGridEl.scrollTop = dragStartScroll + scrollDelta;
});

document.addEventListener('mouseup', function() {
  if (!isDragging) return;
  isDragging = false;
  thumbEl.classList.remove('dragging');
});

trackEl.addEventListener('mousedown', function(e) {
  if (e.target === thumbEl) return;
  if (e.target === arrowUpEl || e.target === arrowDownEl) return;

  const scrollable = charGridEl.scrollHeight - charGridEl.clientHeight;
  if (scrollable <= 0) return;

  const bounds = getTrackBounds();
  const rect = trackEl.getBoundingClientRect();
  const clickY = e.clientY - rect.top;
  const ratio = Math.max(0, Math.min(1, (clickY - bounds.top) / bounds.height));
  charGridEl.scrollTop = ratio * scrollable;
});

arrowUpEl.addEventListener('click', function(e) {
  e.stopPropagation();
  charGridEl.scrollBy({ top: -220, behavior: 'smooth' });
});
arrowDownEl.addEventListener('click', function(e) {
  e.stopPropagation();
  charGridEl.scrollBy({ top: 220, behavior: 'smooth' });
});

charGridEl.addEventListener('scroll', updateThumb);
window.addEventListener('resize', updateThumb);

   ЛЕНТА ОБНОВЛЕНИЙ
   ============================================================ */

const updatesToggleEl   = document.getElementById('updatesToggle');
const updatesOverlayEl  = document.getElementById('updatesOverlay');
const updatesPanelEl    = document.getElementById('updatesPanel');
const updatesCloseEl    = document.getElementById('updatesClose');
const updatesCharsEl    = document.getElementById('updatesChars');
const updatesCostumesEl = document.getElementById('updatesCostumes');
const charCountEl       = document.getElementById('charCount');
const costCountEl       = document.getElementById('costCount');

function openUpdates() {
  updatesOverlayEl.classList.add('open');
  updatesPanelEl.classList.add('open');
  buildUpdatesList();
}
function closeUpdates() {
  updatesOverlayEl.classList.remove('open');
  updatesPanelEl.classList.remove('open');
}
updatesToggleEl.addEventListener('click', function(e) {
  e.stopPropagation();
  if (updatesPanelEl.classList.contains('open')) closeUpdates();
  else openUpdates();
});
updatesCloseEl.addEventListener('click', closeUpdates);
updatesOverlayEl.addEventListener('click', closeUpdates);
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && updatesPanelEl.classList.contains('open')) closeUpdates();
});

function buildUpdatesList() {
  const newChars = [];
  const newCostumes = [];

  characters.forEach(function(c, ci) {
    if (c.added) {
      newChars.push({
        date: c.added, charIdx: ci, charImg: c.portrait,
        charTitle: c.title || ('Персонаж #' + (ci + 1))
      });
    }
    c.costumes.forEach(function(cost, csi) {
      if (cost.added) {
        newCostumes.push({
          date: cost.added, charIdx: ci, costIdx: csi,
          charImg: c.portrait, costImg: cost.icon,
          charTitle: c.title || ('Персонаж #' + (ci + 1)),
          costTitle: cost.title || ('Костюм #' + (csi + 1))
        });
      }
    });
  });

  function byDateDesc(a, b) { return b.date.localeCompare(a.date); }
  newChars.sort(byDateDesc);
  newCostumes.sort(byDateDesc);

  charCountEl.textContent = characters.length;
  let totalCostumes = 0;
  characters.forEach(function(c) { totalCostumes += c.costumes.length; });
  costCountEl.textContent = totalCostumes;

  updatesCharsEl.innerHTML = '';
  updatesCostumesEl.innerHTML = '';

  if (newChars.length > 0) {
    newChars.forEach(function(item) { updatesCharsEl.appendChild(makeCharRow(item)); });
  } else {
    const empty = document.createElement('div');
    empty.className = 'updates-empty';
    empty.textContent = 'Пока нет данных.';
    updatesCharsEl.appendChild(empty);
  }

  if (newCostumes.length > 0) {
    newCostumes.forEach(function(item) { updatesCostumesEl.appendChild(makeCostumeRow(item)); });
  } else {
    const empty = document.createElement('div');
    empty.className = 'updates-empty';
    empty.textContent = 'Пока нет данных.';
    updatesCostumesEl.appendChild(empty);
  }
}

function makeCharRow(item) {
  const row = document.createElement('div');
  const owned = isCharOwned(item.charIdx);
  row.className = 'update-item' + (owned ? '' : ' locked');

  const imgs = document.createElement('div');
  imgs.className = 'imgs';
  const imgChar = document.createElement('img');
  imgChar.src = item.charImg;
  imgChar.alt = '';
  imgs.appendChild(imgChar);
  row.appendChild(imgs);

  const info = document.createElement('div');
  info.className = 'info';
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = item.charTitle;
  info.appendChild(label);
  const date = document.createElement('div');
  date.className = 'date';
  date.textContent = formatDate(item.date) + ' · ' + daysAgo(item.date);
  info.appendChild(date);
  row.appendChild(info);

  row.onclick = function() {
    if (!owned) {
      row.style.opacity = '0.5';
      setTimeout(function() { row.style.opacity = ''; }, 200);

    }
    player.char = item.charIdx;
    player.costume = firstOwnedCostume(item.charIdx);
    player.offset = 0;
    renderPlayer();
    renderGrid();
    closeUpdates();
  };
  return row;
}

function makeCostumeRow(item) {
  const row = document.createElement('div');
  const owned = isCostumeOwned(item.charIdx, item.costIdx);
  row.className = 'update-item' + (owned ? '' : ' locked');

  imgs.appendChild(imgCost);

  imgChar.src = item.charImg; imgChar.alt = '';
  imgs.appendChild(imgChar);
  row.appendChild(imgs);

  const info = document.createElement('div');
  info.className = 'info';
  const label = document.createElement('div');
  label.className = 'label'; label.textContent = item.costTitle;
  info.appendChild(label);
  const sub = document.createElement('div');
  sub.className = 'sub'; sub.textContent = item.charTitle;
  info.appendChild(sub);
  const date = document.createElement('div');
  date.className = 'date';
  date.textContent = formatDate(item.date) + ' · ' + daysAgo(item.date);
  info.appendChild(date);
  row.appendChild(info);

  row.onclick = function() {
    if (!owned) {
      row.style.opacity = '0.5';
      setTimeout(function() { row.style.opacity = ''; }, 200);
      return;
    }
    player.char = item.charIdx;
    player.costume = item.costIdx;
    player.offset = 0;
    renderPlayer();
    renderGrid();
    closeUpdates();
  };
  return row;
}

function daysAgo(str) {
  if (!str) return '';
  const parts = str.split('-');
  if (parts.length !== 3) return '';
  const added = new Date(+parts[0], +parts[1] - 1, +parts[2]);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diffMs = today - added;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (diffDays <= 0) return 'сегодня';
  if (diffDays === 1) return 'вчера';
  return diffDays + ' дн. назад';
}

function formatDate(str) {
  if (!str) return '';
  const parts = str.split('-');
  if (parts.length !== 3) return str;
  return parts[2] + '.' + parts[1] + '.' + parts[0];
}

const GACHA = {
  storageKey:       'chars_gacha_v1',
  activeProfileKey: 'chars_gacha_v1_activeProfile',
  startTokens:      10,
  boxPrice:         5,
  roundSeconds:     15,
  crystalLife:      500,
  crystalGap:       50,
  scorePerToken:    1,
  maxTokensPerRound:15,
  cooldownMs:       20000,
  duplicateChance:  0.20,
  rarityWeights: { common: 55, rare: 30, epic: 12, legendary: 3 },
  pityLimit: 50,
  duplicateRewardByRarity: { common: 1, rare: 3, epic: 7, legendary: 15 }
};

const GACHA_UI = {
  boxClosed: "images/gacha/box_closed.png",
  token:     "images/gacha/token.png"
};

/* ============================================================
   ГАЧА — СОСТОЯНИЕ
   ============================================================ */

const gachaState = {
  tokens:      GACHA.startTokens,
  owned:       new Set(),
  lastGameAt:  0,
  pityCounter: 0
};

let activeProfile = 1;

function profileStorageKey(profileId) {
  return GACHA.storageKey + '_p' + profileId;
}

function gachaSave() {
  try {
    localStorage.setItem(profileStorageKey(activeProfile), JSON.stringify({
      tokens: gachaState.tokens,
      owned: Array.from(gachaState.owned),
      lastGameAt: gachaState.lastGameAt,
      pityCounter: gachaState.pityCounter
    }));
    localStorage.setItem(GACHA.activeProfileKey, String(activeProfile));
  } catch (e) { }
}

function gachaLoad() {
  gachaState.tokens = GACHA.startTokens;
  gachaState.owned = new Set();
  gachaState.lastGameAt = 0;
  gachaState.pityCounter = 0;

  try {
    const raw = localStorage.getItem(profileStorageKey(activeProfile));
    if (!raw) return;
    const data = JSON.parse(raw);
    if (typeof data.tokens === 'number') gachaState.tokens = data.tokens;
    if (Array.isArray(data.owned))       gachaState.owned = new Set(data.owned);
    if (typeof data.lastGameAt === 'number') gachaState.lastGameAt = data.lastGameAt;
    if (typeof data.pityCounter === 'number') gachaState.pityCounter = data.pityCounter;
  } catch (e) { }
}

function loadActiveProfileId() {
  try {
    const n = parseInt(localStorage.getItem(GACHA.activeProfileKey), 10);
    if (n === 1 || n === 2) return n;
  } catch (e) { }
  return 1;
}

function switchProfile(newProfile) {
  if (newProfile === activeProfile) return;
  gachaSave();
  activeProfile = newProfile;
  gachaLoad();
  refreshGachaHeader();
  updateProfileButtons();
  renderPlayer();
  renderGrid();
}

function updateProfileButtons() {
  document.querySelectorAll('.profile-btn').forEach(function(btn) {
    const p = parseInt(btn.getAttribute('data-profile'), 10);
    btn.classList.toggle('active', p === activeProfile);
  });
}

document.querySelectorAll('.profile-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    const p = parseInt(btn.getAttribute('data-profile'), 10);
    switchProfile(p);
  });
});

function isCostumeOwned(ci, si) {
  return gachaState.owned.has(ci + ':' + si);
}

function isCharOwned(ci) {
  const c = characters[ci];
  if (!c) return false;
  for (let si = 0; si < c.costumes.length; si++) {
    if (isCostumeOwned(ci, si)) return true;
  }
  return false;
}

function totalCostumesCount() {
  let n = 0;
  characters.forEach(function(c) { n += c.costumes.length; });
  return n;
}

function firstOwnedCostume(ci) {
  const c = characters[ci];
  if (!c) return 0;
  for (let si = 0; si < c.costumes.length; si++) {
    if (isCostumeOwned(ci, si)) return si;
  }
  return 0;
}

function nextOwnedCostume(ci, current) {
  const c = characters[ci];
  if (!c) return -1;
  for (let si = current + 1; si < c.costumes.length; si++) {
    if (isCostumeOwned(ci, si)) return si;
  }
  return -1;
}

function prevOwnedCostume(ci, current) {
  const c = characters[ci];
  if (!c) return -1;
  for (let si = current - 1; si >= 0; si--) {
    if (isCostumeOwned(ci, si)) return si;
  }
  return -1;
}

/* ============================================================
   ГАЧА — ВЫБОР НАГРАДЫ С РЕДКОСТЬЮ И PITY
   ============================================================ */

function getRarityOf(ci, si) {
  const c = characters[ci];
  if (!c || !c.costumes[si]) return 'common';
  return c.costumes[si].rarity || 'common';
}

function pickRarity() {
  const weights = GACHA.rarityWeights;
  const total = Object.values(weights).reduce((a, b) => a + b, 0);
  let roll = Math.random() * total;
  for (const r in weights) {
    roll -= weights[r];
    if (roll <= 0) return r;
  }
  return 'common';
}

function getUnownedPoolByRarity(rarity) {
  const result = [];
  characters.forEach(function(c, ci) {
    c.costumes.forEach(function(cost, si) {
      if (!isCostumeOwned(ci, si) && (cost.rarity || 'common') === rarity) {
        result.push({ ci: ci, si: si });
      }
    });
  });
  return result;
}

function getOwnedCostumes() {
  const result = [];
  gachaState.owned.forEach(function(key) {
    const parts = key.split(':');
    const ci = +parts[0];
    const si = +parts[1];
    if (characters[ci] && characters[ci].costumes[si]) {
      result.push({ ci: ci, si: si });
    }
  });
  return result;
}

const RARITY_ORDER = ['common', 'rare', 'epic', 'legendary'];

function pickBoxReward() {
  if (gachaState.pityCounter >= GACHA.pityLimit - 1) {
    const legendaryPool = getUnownedPoolByRarity('legendary');
    if (legendaryPool.length > 0) {
      const pick = legendaryPool[Math.floor(Math.random() * legendaryPool.length)];
      return { type: 'new-costume', rarity: 'legendary', ci: pick.ci, si: pick.si, pity: true };
    }
  }

  const ownedList = getOwnedCostumes();
  const hasUnowned = characters.some(function(c, ci) {
    return c.costumes.some(function(_, si) { return !isCostumeOwned(ci, si); });
  });

  if (ownedList.length > 0 && hasUnowned && Math.random() < GACHA.duplicateChance) {
    const pick = ownedList[Math.floor(Math.random() * ownedList.length)];
    const rar = getRarityOf(pick.ci, pick.si);
    return { type: 'duplicate', rarity: rar, ci: pick.ci, si: pick.si };
  }

  let rolledRarity = pickRarity();
  let startIdx = RARITY_ORDER.indexOf(rolledRarity);

  for (let i = startIdx; i < RARITY_ORDER.length; i++) {
    const pool = getUnownedPoolByRarity(RARITY_ORDER[i]);
    if (pool.length > 0) {
      const pick = pool[Math.floor(Math.random() * pool.length)];
      return { type: 'new-costume', rarity: RARITY_ORDER[i], ci: pick.ci, si: pick.si, rolled: rolledRarity };
    }
  }

  for (let i = startIdx - 1; i >= 0; i--) {
    const pool = getUnownedPoolByRarity(RARITY_ORDER[i]);
    if (pool.length > 0) {
      const pick = pool[Math.floor(Math.random() * pool.length)];
      return { type: 'new-costume', rarity: RARITY_ORDER[i], ci: pick.ci, si: pick.si, rolled: rolledRarity };
    }
  }

  return { type: 'nothing' };
}

  gachaState.tokens     = GACHA.startTokens;
  gachaState.owned      = new Set();

const mgFieldEl  = document.getElementById('mgField');
const mgTimeEl   = document.getElementById('mgTime');
const mgScoreEl  = document.getElementById('mgScore');
const mgResultEl = document.getElementById('mgResult');
const mgStartBtn = document.getElementById('mgStart');

let mgTimer      = null;
let mgSpawnTimer = null;
let mgTimeLeft   = 0;
let mgScore      = 0;
let mgRunning    = false;

function stopMinigame() {
  mgRunning = false;
  clearInterval(mgTimer);
  clearTimeout(mgSpawnTimer);
  mgTimer = null;
  mgSpawnTimer = null;
  mgFieldEl.innerHTML = '';
}

function spawnCrystal() {
  if (!mgRunning) return;
  const field = mgFieldEl;
  const size = 44;
  const w = field.clientWidth;
  const h = field.clientHeight;
  const crystal = document.createElement('div');
  crystal.className = 'crystal';
  const x = Math.random() * (w - size) + size / 2;
  const y = Math.random() * (h - size) + size / 2;
  crystal.style.left = x + 'px';
  crystal.style.top  = y + 'px';
  crystal.addEventListener('pointerdown', function(e) {
    e.stopPropagation();
    if (!mgRunning) return;
    mgScore++;
    mgScoreEl.textContent = mgScore;
    crystal.remove();
  });
  field.appendChild(crystal);
  setTimeout(function() { if (crystal.parentNode) crystal.remove(); }, GACHA.crystalLife);
  mgSpawnTimer = setTimeout(spawnCrystal, GACHA.crystalLife + GACHA.crystalGap);
}

function startMinigame() {
  const now = Date.now();
  const wait = GACHA.cooldownMs - (now - gachaState.lastGameAt);
  if (wait > 0) {
    mgResultEl.innerHTML = 'Подожди ещё <b>' + Math.ceil(wait / 1000) + '</b> с.';
    return;
  }
  stopMinigame();
  mgRunning    = true;
  mgScore      = 0;
  mgTimeLeft   = GACHA.roundSeconds;
  mgScoreEl.textContent = 0;
  mgTimeEl.textContent  = mgTimeLeft;
  mgResultEl.textContent = '';
  mgStartBtn.disabled = true;
  mgTimer = setInterval(function() {
    mgTimeLeft--;
    mgTimeEl.textContent = Math.max(0, mgTimeLeft);
    if (mgTimeLeft <= 0) finishMinigame();
  }, 1000);
  spawnCrystal();
}

function finishMinigame() {
  stopMinigame();
  gachaState.lastGameAt = Date.now();
  let reward = Math.floor(mgScore / GACHA.scorePerToken);
  if (reward > GACHA.maxTokensPerRound) reward = GACHA.maxTokensPerRound;
  gachaState.tokens += reward;
  gachaSave();
  refreshGachaHeader();
  mgResultEl.innerHTML = 'Счёт: <b>' + mgScore + '</b>. Получено жетонов: <b>' + reward + '</b>.';
  mgStartBtn.disabled = false;
  const check = setInterval(function() {
    if (!minigameModalEl.classList.contains('open')) { clearInterval(check); return; }
    const w = GACHA.cooldownMs - (Date.now() - gachaState.lastGameAt);
    if (w <= 0) { mgStartBtn.disabled = false; clearInterval(check); }
    else { mgStartBtn.disabled = true; }
  }, 500);
}

mgStartBtn.addEventListener('click', startMinigame);

document.getElementById('minigameToggle').addEventListener('click', function() {
  mgResultEl.textContent = '';
  mgScoreEl.textContent  = 0;
  mgTimeEl.textContent   = GACHA.roundSeconds;
  mgStartBtn.disabled    = false;
  stopMinigame();
  openModal(minigameModalEl);
});

const boxVisualEl = document.getElementById('boxVisual');
const boxResultEl = document.getElementById('boxResult');
const boxOpenBtn  = document.getElementById('boxOpenBtn');
const boxResetBtn = document.getElementById('boxResetBtn');

let boxAnimating = false;
let resetConfirmPending = false;
let resetConfirmTimer = null;

function resetBoxVisual() {
  boxVisualEl.classList.remove('fallback');
  boxVisualEl.innerHTML = '<img class="box-img" src="' + GACHA_UI.boxClosed + '" alt="" ' +
    'onerror="this.style.display=\'none\';this.parentNode.classList.add(\'fallback\');this.parentNode.textContent=\'BOX\';" >';
}

const RARITY_LABEL = { common: 'COMMON', rare: 'RARE', epic: 'EPIC', legendary: 'LEGENDARY' };

function openBox() {
  if (boxAnimating) return;
  if (gachaState.tokens < GACHA.boxPrice) {
    boxResultEl.innerHTML = 'Не хватает жетонов. Нужно <b>' + GACHA.boxPrice + '</b>.';
    return;
  }

  const reward = pickBoxReward();
  if (reward.type === 'nothing') {
    boxResultEl.innerHTML = 'Все костюмы уже собраны! <b>Поздравляю.</b>';
    return;
  }

  boxAnimating = true;
  boxOpenBtn.disabled = true;
  boxResultEl.textContent = 'Открываем...';
  boxVisualEl.classList.remove('fallback');
  boxVisualEl.innerHTML = '<img class="box-img" src="' + GACHA_UI.boxClosed + '" alt="" ' +
    'onerror="this.style.display=\'none\';this.parentNode.classList.add(\'fallback\');this.parentNode.textContent=\'BOX\';" >';
  const boxImg = boxVisualEl.querySelector('img.box-img');
  if (boxImg) boxImg.classList.add('shaking');

  setTimeout(function() {
    const img = boxVisualEl.querySelector('img.box-img');
    if (img) img.classList.remove('shaking');

    const c = characters[reward.ci];
    const cost = c.costumes[reward.si];

    if (reward.rarity === 'legendary') {
      gachaState.pityCounter = 0;
    } else {
      gachaState.pityCounter++;
    }

    gachaState.tokens -= GACHA.boxPrice;
    let dupReward = 0;
    if (reward.type === 'duplicate') {
      dupReward = GACHA.duplicateRewardByRarity[reward.rarity] || 1;
      gachaState.tokens += dupReward;
    } else {
      gachaState.owned.add(reward.ci + ':' + reward.si);
    }

    gachaSave();
    refreshGachaHeader();

    boxVisualEl.classList.remove('fallback');
    boxVisualEl.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'reward-card' + (reward.type === 'duplicate' ? ' duplicate' : '');
    card.setAttribute('data-rarity', reward.rarity);

    const badge = document.createElement('div');
    badge.className = 'rarity-badge';
    badge.textContent = RARITY_LABEL[reward.rarity] || reward.rarity.toUpperCase();
    card.appendChild(badge);

    const inner = document.createElement('div');
    inner.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:6px;';
    let statusText;
    if (reward.type === 'duplicate') statusText = 'Дубликат · +' + dupReward + ' жетона';
    else statusText = 'Новый костюм!';
    if (reward.pity) statusText = 'Гарант · Легендарка!';

    inner.innerHTML =
      '<img src="' + cost.image + '" alt="">' +
      '<div class="reward-title">' + (cost.title || 'Костюм') + '</div>' +
      '<div class="reward-sub">' + (c.title || 'Персонаж') + '</div>' +
      '<div class="reward-status">' + statusText + '</div>';
    card.appendChild(inner);
    boxVisualEl.appendChild(card);

    let resText;
    if (reward.type === 'duplicate') {
      resText = 'Дубликат <b>' + RARITY_LABEL[reward.rarity] + '</b>: ' +
                (c.title || 'Персонаж') + ' — ' + (cost.title || 'Костюм') +
                '. Компенсация: <b>+' + dupReward + '</b>.';
    } else {
      resText = 'Получено <b>' + RARITY_LABEL[reward.rarity] + '</b>: ' +
                (c.title || 'Персонаж') + ' — ' + (cost.title || 'Костюм');
    }
    if (reward.pity) resText = '<b>PITY!</b> ' + resText;
    boxResultEl.innerHTML = resText;

    renderPlayer();
    renderGrid();

    boxAnimating = false;
    boxOpenBtn.disabled = false;
  }, 600);
}

const collSummaryEl  = document.getElementById('collSummary');
const collSectionsEl = document.getElementById('collSections');

function buildCollection() {
  collSummaryEl.innerHTML = 'Профиль P' + activeProfile + ' — Собрано: <b>' + gachaState.owned.size + ' / ' + totalCostumesCount() + '</b>';
  collSectionsEl.innerHTML = '';

  characters.forEach(function(c, ci) {
    const total = c.costumes.length;
    const ownedHere = c.costumes.reduce(function(acc, _, si) {
      return acc + (isCostumeOwned(ci, si) ? 1 : 0);
    }, 0);

    const section = document.createElement('div');
    section.className = 'collection-section-title';
    section.textContent = (c.title || ('Персонаж #' + (ci + 1))) + ' — ' + ownedHere + ' / ' + total;
    collSectionsEl.appendChild(section);

    const grid = document.createElement('div');
    grid.className = 'collection-grid';

    c.costumes.forEach(function(cost, si) {
      const cell = document.createElement('div');
      const owned = isCostumeOwned(ci, si);
      cell.className = 'collection-cell' + (owned ? '' : ' locked');
      cell.setAttribute('data-rarity', cost.rarity || 'common');
      if (owned) {
        cell.innerHTML =
          '<img class="main-img" src="' + cost.image + '" alt="">' +
          '<img class="costume-icon" src="' + cost.icon + '" alt="">';
      }
      grid.appendChild(cell);
    });

    collSectionsEl.appendChild(grid);
  });
}

document.getElementById('collectionToggle').addEventListener('click', function() {

<script>
const UI = { plus: "images/ui/plus.png", left: "images/ui/arrow_left.png", right: "images/ui/arrow_right.png" };
const characters = __CHARACTERS_JSON__;
const VISIBLE = 5;
const BTN_SIZE = 54;
const BTN_GAP = 8;
const players = { 1: { char: 0, costume: 0, offset: 0 }, 2: { char: 0, costume: 0, offset: 0 } };
let activePlayer = 1;
const charGridEl  = document.getElementById('charGrid');
const trackEl     = document.getElementById('scrollTrack');
const thumbEl     = document.getElementById('sliderThumb');
const arrowUpEl   = document.getElementById('arrowUp');
const arrowDownEl = document.getElementById('arrowDown');
const panels = {
  1: { panel: document.getElementById('panel1'), name: document.getElementById('name1'), image: document.getElementById('image1'), list: document.getElementById('costumes1'), prev: document.getElementById('prev1'), next: document.getElementById('next1'), statsEl: document.getElementById('stats1'), statsImg: document.getElementById('statsImg1') },
  2: { panel: document.getElementById('panel2'), name: document.getElementById('name2'), image: document.getElementById('image2'), list: document.getElementById('costumes2'), prev: document.getElementById('prev2'), next: document.getElementById('next2'), statsEl: document.getElementById('stats2'), statsImg: document.getElementById('statsImg2') }
};

function renderPlayer(playerId) {
  const state = players[playerId];
  const ui = panels[playerId];
  const char = characters[state.char];
  ui.name.innerHTML = '<img src="' + char.name + '" alt="">';
  const costume = char.costumes[state.costume];
  if (costume && costume.image) ui.image.innerHTML = '<img src="' + costume.image + '" alt="">';
  else ui.image.innerHTML = '';
  if (costume && costume.stats) ui.statsImg.src = costume.stats;
  else ui.statsImg.src = '';
  const totalItems = char.costumes.length + 1;
  ui.list.innerHTML = '';
  char.costumes.forEach(function(c, i) {
    const btn = document.createElement('button');
    btn.className = 'costume-btn' + (i === state.costume ? ' active' : '');
    btn.innerHTML = '<img src="' + c.icon + '" alt="">';
    btn.onclick = function(e) { e.stopPropagation(); state.costume = i; renderPlayer(playerId); };
    ui.list.appendChild(btn);
  });
  const addCostume = document.createElement('button');
  addCostume.className = 'costume-btn';
  addCostume.innerHTML = '<img src="' + UI.plus + '" alt="">';
  ui.list.appendChild(addCostume);
  const shift = state.offset * (BTN_SIZE + BTN_GAP);
  ui.list.style.transform = 'translateX(' + (-shift) + 'px)';
  if (totalItems > VISIBLE) {
    ui.prev.classList.remove('hidden');
    ui.next.classList.remove('hidden');
    ui.prev.classList.toggle('hidden', state.offset === 0);
    ui.next.classList.toggle('hidden', state.offset >= totalItems - VISIBLE);
  } else {
    ui.prev.classList.add('hidden');
    ui.next.classList.add('hidden');
  }
}

function renderGrid() {
  charGridEl.innerHTML = '';
  characters.forEach(function(c, i) {
    const btn = document.createElement('button');
    let cls = 'portrait-btn';
    const p1 = players[1].char === i;
    const p2 = players[2].char === i;
    if (p1 && p2) cls += ' both-active';
    else if (p1) cls += ' p1-active';
    else if (p2) cls += ' p2-active';
    btn.className = cls;
    btn.innerHTML = '<img src="' + c.portrait + '" alt="">';
    btn.onclick = function() {
      players[activePlayer].char = i;
      players[activePlayer].costume = 0;
      players[activePlayer].offset = 0;
      renderPlayer(activePlayer);
      renderGrid();
    };
    charGridEl.appendChild(btn);
  });
  const addChar = document.createElement('button');
  addChar.className = 'portrait-btn';
  addChar.innerHTML = '<img src="' + UI.plus + '" alt="">';
  charGridEl.appendChild(addChar);
  updateThumb();
}

function setActivePlayer(playerId) {
  activePlayer = playerId;
  panels[1].panel.classList.toggle('active', playerId === 1);
  panels[2].panel.classList.toggle('active', playerId === 2);
}
panels[1].panel.addEventListener('click', function() { setActivePlayer(1); });
panels[2].panel.addEventListener('click', function() { setActivePlayer(2); });

function toggleStats(playerId) {
  const ui = panels[playerId];
  ui.statsEl.classList.toggle('open');
}
panels[1].name.addEventListener('click', function(e) { e.stopPropagation(); toggleStats(1); });
panels[2].name.addEventListener('click', function(e) { e.stopPropagation(); toggleStats(2); });
panels[1].statsEl.addEventListener('click', function(e) { e.stopPropagation(); toggleStats(1); });
panels[2].statsEl.addEventListener('click', function(e) { e.stopPropagation(); toggleStats(2); });

[1, 2].forEach(function(playerId) {
  const state = players[playerId];
  const ui = panels[playerId];
  ui.prev.addEventListener('click', function(e) {
    e.stopPropagation();
    if (state.offset > 0) { state.offset--; renderPlayer(playerId); }
  });
  ui.next.addEventListener('click', function(e) {
    e.stopPropagation();
    const totalItems = characters[state.char].costumes.length + 1;
    if (state.offset < totalItems - VISIBLE) { state.offset++; renderPlayer(playerId); }
  });
});

function getTrackBounds() { const rect = trackEl.getBoundingClientRect(); return { top: 0, bottom: rect.height, height: rect.height }; }
function updateThumb() {
  const bounds = getTrackBounds();
  const scrollable = charGridEl.scrollHeight - charGridEl.clientHeight;
  let thumbSize = 28;
  if (scrollable > 0) {
    const visibleRatio = charGridEl.clientHeight / charGridEl.scrollHeight;
    thumbSize = Math.max(20, Math.min(28, bounds.height * visibleRatio));
  }
  thumbEl.style.width = thumbSize + 'px';
  thumbEl.style.height = thumbSize + 'px';
  if (scrollable <= 0) { thumbEl.style.top = (bounds.top + bounds.height / 2) + 'px'; return; }
  const ratio = charGridEl.scrollTop / scrollable;
  const maxTop = bounds.height - thumbSize;
  thumbEl.style.top = (thumbSize / 2 + ratio * maxTop) + 'px';
}
let isDragging = false; let dragStartY = 0; let dragStartScroll = 0;
thumbEl.addEventListener('mousedown', function(e) {
  isDragging = true; dragStartY = e.clientY; dragStartScroll = charGridEl.scrollTop;
  thumbEl.classList.add('dragging'); e.preventDefault(); e.stopPropagation();
});
document.addEventListener('mousemove', function(e) {
  if (!isDragging) return;
  const bounds = getTrackBounds();
  const scrollable = charGridEl.scrollHeight - charGridEl.clientHeight;
  if (scrollable <= 0) return;
  const thumbSize = thumbEl.offsetHeight;
  const maxTop = bounds.height - thumbSize;
  const deltaY = e.clientY - dragStartY;
  const scrollDelta = (deltaY / maxTop) * scrollable;
  charGridEl.scrollTop = dragStartScroll + scrollDelta;
});
document.addEventListener('mouseup', function() {
  if (!isDragging) return;
  isDragging = false; thumbEl.classList.remove('dragging');
});
trackEl.addEventListener('mousedown', function(e) {
  if (e.target === thumbEl) return;
  if (e.target === arrowUpEl || e.target === arrowDownEl) return;
  const scrollable = charGridEl.scrollHeight - charGridEl.clientHeight;
  if (scrollable <= 0) return;
  const bounds = getTrackBounds();
  const rect = trackEl.getBoundingClientRect();
  const clickY = e.clientY - rect.top;
  const ratio = Math.max(0, Math.min(1, (clickY - bounds.top) / bounds.height));
  charGridEl.scrollTop = ratio * scrollable;
});
arrowUpEl.addEventListener('click', function(e) { e.stopPropagation(); charGridEl.scrollBy({ top: -220, behavior: 'smooth' }); });
arrowDownEl.addEventListener('click', function(e) { e.stopPropagation(); charGridEl.scrollBy({ top: 220, behavior: 'smooth' }); });
charGridEl.addEventListener('scroll', updateThumb);
window.addEventListener('resize', updateThumb);

const updatesToggleEl   = document.getElementById('updatesToggle');
const updatesOverlayEl  = document.getElementById('updatesOverlay');
const updatesPanelEl    = document.getElementById('updatesPanel');
const updatesCloseEl    = document.getElementById('updatesClose');
const updatesCharsEl    = document.getElementById('updatesChars');
const updatesCostumesEl = document.getElementById('updatesCostumes');
const charCountEl       = document.getElementById('charCount');
const costCountEl       = document.getElementById('costCount');
function openUpdates() { updatesOverlayEl.classList.add('open'); updatesPanelEl.classList.add('open'); buildUpdatesList(); }
function closeUpdates() { updatesOverlayEl.classList.remove('open'); updatesPanelEl.classList.remove('open'); }
updatesToggleEl.addEventListener('click', function(e) {
  e.stopPropagation();
  if (updatesPanelEl.classList.contains('open')) closeUpdates();
  else openUpdates();
});
updatesCloseEl.addEventListener('click', closeUpdates);
updatesOverlayEl.addEventListener('click', closeUpdates);
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && updatesPanelEl.classList.contains('open')) closeUpdates();
});

function buildUpdatesList() {
  const newChars = []; const newCostumes = [];
  characters.forEach(function(c, ci) {
    if (c.added) newChars.push({ date: c.added, charIdx: ci, charImg: c.portrait, charTitle: c.title || ('Персонаж #' + (ci + 1)) });
    c.costumes.forEach(function(cost, csi) {
      if (cost.added) newCostumes.push({ date: cost.added, charIdx: ci, costIdx: csi, charImg: c.portrait, costImg: cost.icon, charTitle: c.title || ('Персонаж #' + (ci + 1)), costTitle: cost.title || ('Костюм #' + (csi + 1)) });
    });
  });
  function byDateDesc(a, b) { return b.date.localeCompare(a.date); }
  newChars.sort(byDateDesc); newCostumes.sort(byDateDesc);
  charCountEl.textContent = characters.length;
  let totalCostumes = 0;
  characters.forEach(function(c) { totalCostumes += c.costumes.length; });
  costCountEl.textContent = totalCostumes;
  updatesCharsEl.innerHTML = ''; updatesCostumesEl.innerHTML = '';
  if (newChars.length > 0) newChars.forEach(function(item) { updatesCharsEl.appendChild(makeCharRow(item)); });
  else { const empty = document.createElement('div'); empty.className = 'updates-empty'; empty.textContent = 'Пока нет данных.'; updatesCharsEl.appendChild(empty); }
  if (newCostumes.length > 0) newCostumes.forEach(function(item) { updatesCostumesEl.appendChild(makeCostumeRow(item)); });
  else { const empty = document.createElement('div'); empty.className = 'updates-empty'; empty.textContent = 'Пока нет данных.'; updatesCostumesEl.appendChild(empty); }
}
function makeCharRow(item) {
  const row = document.createElement('div'); row.className = 'update-item';
  const imgs = document.createElement('div'); imgs.className = 'imgs';
  const imgChar = document.createElement('img'); imgChar.src = item.charImg; imgChar.alt = '';
  imgs.appendChild(imgChar); row.appendChild(imgs);
  const info = document.createElement('div'); info.className = 'info';
  const label = document.createElement('div'); label.className = 'label'; label.textContent = item.charTitle;
  info.appendChild(label);

function daysAgo(str) {
  if (!str) return '';
  const parts = str.split('-'); if (parts.length !== 3) return '';
  const added = new Date(+parts[0], +parts[1] - 1, +parts[2]);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diffMs = today - added;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (diffDays <= 0) return 'сегодня';
  if (diffDays === 1) return 'вчера';
  return diffDays + ' дн. назад';
}
